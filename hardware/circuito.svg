<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="980" height="520" fill="#ffffff"/>
  <text x="490" y="34" font-size="20" font-weight="600" text-anchor="middle" fill="#1f2937">Circuito del objeto inteligente — Tendedero inteligente</text>
  <text x="490" y="56" font-size="13" text-anchor="middle" fill="#6b7280">ESP32 DevKit V1 alimentado por USB · sensor de agua MH (analógico) · servomotor MG90S · todo conectado a la placa</text>

  <!-- PC / USB -->
  <rect x="40" y="245" width="120" height="70" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="100" y="275" font-size="14" font-weight="600" text-anchor="middle" fill="#111827">PC</text>
  <text x="100" y="295" font-size="12" text-anchor="middle" fill="#374151">USB 5 V + datos</text>
  <line x1="160" y1="280" x2="330" y2="280" stroke="#111827" stroke-width="3"/>
  <text x="245" y="272" font-size="12" text-anchor="middle" fill="#374151">cable USB-C</text>

  <!-- ESP32 -->
  <rect x="330" y="120" width="260" height="340" rx="10" fill="#e8f0fe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="460" y="150" font-size="17" font-weight="700" text-anchor="middle" fill="#1e3a8a">ESP32 DevKit V1</text>
  <text x="460" y="169" font-size="12" text-anchor="middle" fill="#1e40af">esp32doit-devkit-v1</text>
  <text x="342" y="284" font-size="12" fill="#111827">USB</text>
  <text x="430" y="300" font-size="12" text-anchor="middle" fill="#1e40af">Wi-Fi → AWS IoT Core</text>
  <text x="430" y="317" font-size="12" text-anchor="middle" fill="#1e40af">(MQTT/TLS, 8883)</text>
  <g font-size="13" font-weight="600" fill="#111827" text-anchor="end">
    <text x="580" y="205">GND</text>
    <text x="580" y="225">3V3</text>
    <text x="580" y="245">D34 / GPIO34 (ADC1_CH6)</text>
    <text x="580" y="380">D26 / GPIO26 (PWM)</text>
    <text x="580" y="400">VIN (5 V del USB)</text>
    <text x="580" y="420">GND</text>
  </g>
  <g fill="#1d4ed8"><circle cx="590" cy="200" r="4"/><circle cx="590" cy="220" r="4"/><circle cx="590" cy="240" r="4"/><circle cx="590" cy="375" r="4"/><circle cx="590" cy="395" r="4"/><circle cx="590" cy="415" r="4"/></g>

  <!-- Sensor MH -->
  <rect x="760" y="140" width="180" height="125" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="850" y="166" font-size="15" font-weight="700" text-anchor="middle" fill="#064e3b">Sensor de agua MH</text>
  <text x="850" y="184" font-size="12" text-anchor="middle" fill="#065f46">pines S · + · −</text>
  <g font-size="13" font-weight="600" fill="#111827"><text x="772" y="205">−</text><text x="772" y="225">+</text><text x="772" y="245">S (analógica)</text></g>
  <g fill="#047857"><circle cx="760" cy="200" r="4"/><circle cx="760" cy="220" r="4"/><circle cx="760" cy="240" r="4"/></g>

  <!-- Servo -->
  <rect x="760" y="315" width="180" height="125" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="850" y="341" font-size="15" font-weight="700" text-anchor="middle" fill="#7c2d12">Servomotor MG90S</text>
  <text x="850" y="359" font-size="12" text-anchor="middle" fill="#9a3412">cubierta del tendedero</text>
  <g font-size="12" font-weight="600" fill="#111827"><text x="772" y="380">señal (naranja)</text><text x="772" y="400">+ (rojo)</text><text x="772" y="420">− (marrón)</text></g>
  <g fill="#c2410c"><circle cx="760" cy="375" r="4"/><circle cx="760" cy="395" r="4"/><circle cx="760" cy="415" r="4"/></g>

  <!-- Cables -->
  <line x1="590" y1="200" x2="760" y2="200" stroke="#111827" stroke-width="2.5"/>
  <line x1="590" y1="220" x2="760" y2="220" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="590" y1="240" x2="760" y2="240" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="590" y1="375" x2="760" y2="375" stroke="#ea580c" stroke-width="2.5"/>
  <line x1="590" y1="395" x2="760" y2="395" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="590" y1="415" x2="760" y2="415" stroke="#111827" stroke-width="2.5"/>

  <!-- Leyenda -->
  <g font-size="12" fill="#374151">
    <text x="40" y="370" font-weight="700" fill="#111827">Conexiones</text>
    <line x1="40" y1="390" x2="70" y2="390" stroke="#dc2626" stroke-width="3"/><text x="78" y="394">alimentación (+)</text>
    <line x1="40" y1="412" x2="70" y2="412" stroke="#111827" stroke-width="3"/><text x="78" y="416">GND (común en la placa)</text>
    <line x1="40" y1="434" x2="70" y2="434" stroke="#16a34a" stroke-width="3"/><text x="78" y="438">señal analógica del sensor</text>
    <line x1="40" y1="456" x2="70" y2="456" stroke="#ea580c" stroke-width="3"/><text x="78" y="460">señal PWM del servo</text>
  </g>
  <text x="490" y="495" font-size="12" text-anchor="middle" fill="#374151">Los dos pines GND de la placa están unidos internamente. Ningún actuador supera 5 V DC; no hay cargas de 220 V AC.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
