<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
<defs>
  <style>
    .bg{fill:#f7f9fc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}
    .title{font:700 32px Arial,sans-serif;fill:#172033}
    .sub{font:16px Arial,sans-serif;fill:#526078}
    .head{font:700 20px Arial,sans-serif;fill:#172033}
    .label{font:15px Arial,sans-serif;fill:#243247}
    .small{font:13px Arial,sans-serif;fill:#526078}
    .pin{font:700 14px Arial,sans-serif;fill:#172033}
    .wire{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .red{stroke:#e34b4b}.black{stroke:#273449}.orange{stroke:#e68a2e}
    .blue{stroke:#2786d8}.green{stroke:#269b68}.yellow{stroke:#d6a21c}
    .dashed{stroke-dasharray:10 8}
    .node{fill:#fff;stroke:#64748b;stroke-width:2}
    .chip{fill:#eaf0f8;stroke:#58708f;stroke-width:2}
    .note{fill:#fff8e6;stroke:#e5bd55;stroke-width:1.5}
    .optional{fill:#f1f8ff;stroke:#80acd7;stroke-width:2}
  </style>
</defs>
<rect class="bg" width="1600" height="1080"/>
<text x="70" y="62" class="title">Circuito del tendedero automático — P4</text>
<text x="70" y="94" class="sub">ESP32 DevKit v1 · sensor de agua MH · servo MG90S · módulo LDR · LED indicador</text>

<!-- Main panels -->
<rect x="55" y="130" width="1490" height="690" rx="18" class="panel"/>
<text x="85" y="170" class="head">Conexiones principales</text>

<!-- ESP32 -->
<rect x="630" y="235" width="340" height="470" rx="18" class="chip"/>
<text x="800" y="275" text-anchor="middle" class="head">ESP32 DevKit v1</text>
<text x="800" y="301" text-anchor="middle" class="small">Alimentación por USB 5 V</text>
<rect x="735" y="322" width="130" height="330" rx="10" fill="#dce6f2" stroke="#91a4bb"/>
<text x="800" y="352" text-anchor="middle" class="small">Módulo ESP32</text>
<text x="800" y="386" text-anchor="middle" class="small">GPIO / ADC</text>
<text x="800" y="622" text-anchor="middle" class="small">USB</text>

<!-- Left sensor water -->
<rect x="100" y="265" width="360" height="190" rx="14" fill="#f0f9ff" stroke="#65a9d8" stroke-width="2"/>
<text x="280" y="300" text-anchor="middle" class="head">Sensor MH de agua / lluvia</text>
<rect x="145" y="330" width="150" height="75" rx="8" fill="#d6eaf7" stroke="#4b91c4" stroke-width="2"/>
<path d="M160 345h120 M160 360h120 M160 375h120 M160 390h120" stroke="#4b91c4" stroke-width="3"/>
<rect x="325" y="337" width="100" height="60" rx="6" fill="#fff" stroke="#9bb5ca"/>
<text x="375" y="360" text-anchor="middle" class="small">Módulo</text>
<text x="375" y="380" text-anchor="middle" class="small">S / + / −</text>
<text x="280" y="433" text-anchor="middle" class="small">Salida analógica (AO/S según módulo)</text>

<!-- water wires -->
<path d="M460 350 H545 V400 H630" class="wire blue"/>
<path d="M460 385 H515 V690 H650 V660 H700" class="wire black"/>
<path d="M460 420 H565 V215 H675 V235" class="wire red"/>
<text x="520" y="387" class="pin">GPIO34</text>
<text x="520" y="680" class="pin">GND</text>
<text x="570" y="208" class="pin">3V3</text>
<text x="475" y="335" class="small">S / AO</text>
<text x="475" y="378" class="small">−</text>
<text x="475" y="414" class="small">+</text>

<!-- Servo right -->
<rect x="1110" y="265" width="360" height="190" rx="14" fill="#fff7ed" stroke="#e6a15b" stroke-width="2"/>
<text x="1290" y="300" text-anchor="middle" class="head">Servo TowerPro MG90S</text>
<rect x="1190" y="330" width="200" height="82" rx="12" fill="#f3d6b8" stroke="#c98745" stroke-width="2"/>
<circle cx="1290" cy="371" r="23" fill="#fff" stroke="#c98745" stroke-width="3"/>
<path d="M1290 371 L1352 344" stroke="#c98745" stroke-width="9" stroke-linecap="round"/>
<text x="1290" y="438" text-anchor="middle" class="small">Marrón: GND · Rojo: +5 V · Naranja: señal</text>
<!-- servo wires -->
<path d="M1110 350 H1045 V460 H970" class="wire orange"/>
<path d="M1110 385 H1080 V740 H950 V705 H900" class="wire black"/>
<path d="M1110 420 H1040 V190 H900 V235" class="wire red"/>
<text x="1000" y="448" class="pin">GPIO26</text>
<text x="1015" y="730" class="pin">GND</text>
<text x="950" y="183" class="pin">VIN / 5 V</text>

<!-- LDR module -->
<rect x="100" y="545" width="360" height="190" rx="14" class="optional"/>
<text x="280" y="580" text-anchor="middle" class="head">Módulo LDR (opcional P4)</text>
<rect x="175" y="605" width="210" height="72" rx="9" fill="#dcebf8" stroke="#6c9ec8" stroke-width="2"/>
<circle cx="280" cy="641" r="22" fill="#f6d66c" stroke="#bd9a2d" stroke-width="3"/>
<path d="M280 610v-12 M280 684v-12 M249 641h-12 M323 641h-12 M258 619l-9 -9 M311 672l-9 -9 M302 619l9 -9 M249 672l9 -9" stroke="#bd9a2d" stroke-width="3"/>
<text x="280" y="708" text-anchor="middle" class="small">VCC · GND · AO (DO sin conectar)</text>
<path d="M460 620 H545 V520 H630" class="wire blue"/>
<path d="M460 655 H500 V770 H650 V690 H700" class="wire black"/>
<path d="M460 690 H565 V215 H675 V235" class="wire red"/>
<text x="515" y="508" class="pin">GPIO35</text>
<text x="515" y="760" class="pin">GND</text>
<text x="570" y="750" class="small">3V3 compartido</text>

<!-- LED -->
<rect x="1110" y="545" width="360" height="190" rx="14" fill="#fffbea" stroke="#d8b64e" stroke-width="2"/>
<text x="1290" y="580" text-anchor="middle" class="head">LED indicador (opcional P4)</text>
<path d="M1250 635 L1290 595 L1330 635 L1290 675 Z" fill="#f4b4b4" stroke="#c84b4b" stroke-width="3"/>
<path d="M1290 675 V690 M1250 635 H1235 M1330 635 H1345" stroke="#c84b4b" stroke-width="3"/>
<path d="M1340 605l22 -22 M1350 618l22 -22" stroke="#d6a21c" stroke-width="3"/>
<text x="1290" y="710" text-anchor="middle" class="small">GPIO27 → 220 Ω → ánodo (+)</text>
<text x="1290" y="728" text-anchor="middle" class="small">Cátodo (−) → GND</text>
<path d="M1110 620 H1045 V550 H970" class="wire yellow"/>
<path d="M1110 680 H1085 V780 H950 V705 H900" class="wire black"/>
<text x="985" y="538" class="pin">GPIO27</text>
<text x="1000" y="770" class="pin">GND</text>

<!-- legend -->
<rect x="85" y="845" width="1430" height="190" rx="16" class="panel"/>
<text x="115" y="885" class="head">Alimentación, colores y notas de montaje</text>
<line x1="120" y1="920" x2="185" y2="920" class="wire red"/><text x="200" y="926" class="label">Rojo: 3V3 / +5 V según la conexión indicada</text>
<line x1="570" y1="920" x2="635" y2="920" class="wire black"/><text x="650" y="926" class="label">Negro: GND común</text>
<line x1="930" y1="920" x2="995" y2="920" class="wire blue"/><text x="1010" y="926" class="label">Azul: señal analógica / ADC</text>
<line x1="120" y1="965" x2="185" y2="965" class="wire orange"/><text x="200" y="971" class="label">Naranja: señal PWM del servo</text>
<line x1="570" y1="965" x2="635" y2="965" class="wire yellow"/><text x="650" y="971" class="label">Amarillo: salida hacia LED</text>
<text x="930" y="971" class="small">No conectar el servo a 3V3 ni a un GPIO.</text>
<rect x="112" y="990" width="1365" height="30" rx="7" class="note"/>
<text x="130" y="1011" class="small">Servo: usar 5 V regulados; si el ESP32 se reinicia, alimentar el servo con fuente externa regulada de 5 V y unir su GND al GND del ESP32. Nunca aplicar 9 V.</text>
</svg>