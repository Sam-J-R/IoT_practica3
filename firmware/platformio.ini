[platformio]
; Perfil principal: sensor + servo + MQTT TLS + Device Shadow.
default_envs = tendedero_shadow

[env]
platform = espressif32 @ 7.0.1
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

[env:sensor_test]
build_src_filter = +<SensorTest.cpp>

[env:servo_test]
build_src_filter = +<ServoTest.cpp>

[env:sensor_shadow_test]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
build_src_filter = +<SensorShadowTest.cpp> +<ClienteShadow.cpp>

[env:tendedero_shadow]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
build_src_filter = +<Tendedero.cpp> +<ClienteShadow.cpp>

